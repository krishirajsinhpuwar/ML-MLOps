[project]
name = "bike-rental"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "dagster>=1.13.0",
    "pandas>=2.3.3",
    "s3fs>=2026.3.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.0",
    "dagster-webserver>=1.13.0",
    "jupyter>=1.1.1",
    "lab>=8.9",
    "ruff>=0.15.11",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "bike_rental"
registry_modules = ["bike_rental.components.*"]
