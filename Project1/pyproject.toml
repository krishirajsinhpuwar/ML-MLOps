[project]
name = "project1"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.0",
    "pandas>=3.0.2",
    "s3fs>=2026.3.0",
]

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.0",
    "dagster-webserver>=1.13.0",
    "jupyter>=1.1.1",
    "lab>=8.9",
    "ruff>=0.15.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipeline"
code_location_target_module = "pipeline.definitions"
