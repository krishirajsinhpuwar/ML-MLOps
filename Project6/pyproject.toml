[project]
name = "bike-rental"
requires-python = ">=3.10,<3.15"
version = "1.0.0"
readme = "README.md"
dependencies = [
    "dagster==1.12.21",
    "pandas>=2.3.3",
    "s3fs>=2026.4.0",
    "numpy>=2.2.6",
    "matplotlib>=3.10.9",
    "scikit-learn>=1.7.2",
    "xgboost>=3.2.0",
    "mlflow>=2.20",
]

[dependency-groups]
dev = [
    "dagster-webserver",
    "dagster-dg-cli",
    "jupyter>=1.1.1",
    "lab>=8.9",
    "ruff>=0.15.12",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "bike_rental"
registry_modules = ["bike_rental.components.*"]
